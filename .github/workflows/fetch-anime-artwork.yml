name: Download and bundle anime artwork

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-anime-artwork.yml"
      - "scripts/fetch_anime_artwork.py"
      - "data/characters.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anime-artwork-download
  cancel-in-progress: false

jobs:
  download-artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out game
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install downloader dependency
        run: python -m pip install requests
      - name: Download character portraits and anime posters
        run: python scripts/fetch_anime_artwork.py
      - name: Save local images and ZIP into the game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/characters.json assets/
          if git diff --cached --quiet; then
            echo "No artwork changes to save."
          else
            git commit -m "Add bundled local anime artwork"
            git push
          fi
